name: TITÁN Core CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest httpx
          if [ -f apps/backend/requirements.txt ]; then pip install -r apps/backend/requirements.txt; fi

      - name: Check formatting with Black
        run: black --check apps/backend/

      - name: Lint with Ruff
        run: ruff check apps/backend/

      - name: Typecheck with Mypy
        run: mypy apps/backend/ --ignore-missing-imports

      - name: Run unit tests with Pytest
        run: pytest apps/backend/tests/ -v
